<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f7f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CREW作品">
<title>CREW 作品分析</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --card:#fff; --ink:#2b2f33; --ink2:#4a5057; --sub:#646d76; --sub-weak:#8a929a;
  --rule:#e8e4dc; --rule2:#d9d4ca; --accent:#4e8780; --accent2:#3a6a64; --accent-soft:#e9f2f0; --accent-line:#c7dedb;
  --goodln:#bfe0cd; --goodfill:#eef7f1; --goodtx:#1f7a4d;
  --warnln:#e5d3a8; --warnfill:#fbf4e6; --warntx:#8a6414;
  --badln:#eecac5;  --badfill:#fbeceb;  --badtx:#a3413a;
  --neufill:#f1eee8; --shadow:0 1px 2px rgba(60,50,30,.05),0 6px 18px rgba(60,50,30,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;font-feature-settings:"palt"}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Nunito','Noto Sans JP',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif;margin:0}

/* 上部バー */
.top{position:sticky;top:0;z-index:30;background:rgba(251,250,247,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;letter-spacing:.16em;color:var(--accent2);font-size:17px}
.brand span{font-size:11px;letter-spacing:.04em;color:var(--sub);margin-left:8px;font-weight:700}
.sel{border:1px solid var(--rule2);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;max-width:260px}
.datebox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:5px 12px}
.datebox input[type=range]{width:170px;accent-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent2);border:1px solid var(--accent-line);white-space:nowrap}
.chip.neu{background:var(--neufill);color:var(--ink2);border-color:var(--rule)}
.btn{border:1px solid var(--rule2);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.btn:hover{border-color:var(--accent-line);color:var(--accent2)}
.btn kbd{font-family:'Nunito';font-size:11px;color:var(--sub-weak);margin-left:6px}
.m-only{display:none}
.tab .ts{display:none}
#a2hs{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:36;background:#fff;border:1px solid var(--accent-line);border-radius:14px;box-shadow:0 8px 24px rgba(60,50,30,.18);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px}
#a2hs[hidden]{display:none}
#a2hs span{flex:1}
.sp{flex:1}
.internal{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);border:1px dashed var(--rule2);border-radius:999px;padding:4px 6px 4px 12px}
.seg{display:inline-flex;background:var(--neufill);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--accent2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
body.client .internal .seg,body.client .internal .int-l{display:none}
body.client .internal{border-style:solid}

/* ページのタブ */
.tabs{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 16px 11px;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.sig{width:8px;height:8px;border-radius:50%;background:#c9ccd0}
.sig.good{background:#5fae86}.sig.warn{background:#d9ad4f}.sig.bad{background:#d98476}

/* 本文 */
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 80px}
.pg-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pg-head h1{font-size:24px;font-weight:900}
.pg-q{color:var(--sub);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.hit{outline:3px solid var(--accent-line);transition:outline .2s}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:16px;font-weight:700}
.card-h .d{font-size:12px;color:var(--sub)}
.sub-h{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13px;color:var(--ink2);margin:14px 0 8px}
.sub-h:first-child{margin-top:0}
.note{font-size:11.5px;color:var(--sub);margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* 数字のカード */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ncard{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;background:#fff;text-align:left;display:block;width:100%}
.ncard:hover{border-color:var(--accent-line);background:#fcfdfc}
.ncard .k{font-size:12px;color:var(--sub);font-weight:600}
.ncard .v{font-size:24px;line-height:1.25}
.ncard .v small{font-size:12px;color:var(--sub);margin-left:2px;font-weight:600}
.ncard .m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.dp{font-family:'Nunito';font-weight:700;border-radius:999px;padding:0 7px;font-size:11.5px}
.dp.up{background:var(--goodfill);color:var(--goodtx)}.dp.dn{background:var(--badfill);color:var(--badtx)}.dp.fl{background:var(--neufill);color:var(--sub)}
.spark{display:block;width:100%;height:30px;margin-top:6px}

/* 結論 */
.verdict{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--neufill) 0)}
.score>div{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.score b{font-size:34px;line-height:1}
.score span{font-size:10.5px;color:var(--sub);display:block}
.tone{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:700;font-size:12.5px;border:1px solid}
.tone.good{background:var(--goodfill);color:var(--goodtx);border-color:var(--goodln)}
.tone.warn{background:var(--warnfill);color:var(--warntx);border-color:var(--warnln)}
.tone.bad{background:var(--badfill);color:var(--badtx);border-color:var(--badln)}
.verdict h3{font-size:19px;margin:6px 0 8px;font-weight:700}
.fac{display:flex;gap:8px;flex-wrap:wrap}
.fac span{border:1px solid var(--rule);border-radius:10px;padding:4px 10px;font-size:12px;background:#fff}
.fac b{font-family:'Nunito';margin-left:6px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{border-radius:12px;padding:9px 12px;border:1px solid var(--rule);background:#fff;font-size:13px}
.todo li.warn{background:var(--warnfill);border-color:var(--warnln)}
.todo li.good{background:var(--goodfill);border-color:var(--goodln)}
.todo li.bad{background:var(--badfill);border-color:var(--badln)}
.todo li b{display:block;font-family:'Zen Maru Gothic'}

/* グラフ */
.ch{display:flex;gap:8px}
.ch-y{display:flex;flex-direction:column;justify-content:space-between;font-family:'Nunito';font-size:10.5px;color:var(--sub-weak);text-align:right;min-width:38px;padding:0 0 0 0}
.ch-plot{position:relative;flex:1;min-width:0;border-bottom:1px solid var(--rule2)}
.ch-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch-x{position:relative;height:18px;margin-left:46px;font-family:'Nunito','Noto Sans JP';font-size:10.5px;color:var(--sub-weak)}
.ch-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:3px}
.ch-x span.rel{color:var(--accent2);font-weight:700}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:6px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.lg i.dot{width:10px;height:10px;border-radius:50%}
.lg i.band{height:10px;opacity:.25}

/* 年表 */
.tl{position:relative}
.tl-row{display:flex;gap:10px;align-items:stretch;border-top:1px solid var(--rule)}
.tl-row:first-child{border-top:0}
.tl-l{width:168px;flex:none;padding:8px 0}
.tl-l .n{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.tl-l .n i{width:9px;height:9px;border-radius:50%;flex:none}
.tl-l .v{font-size:17px}
.tl-l .v small{font-size:11px;color:var(--sub);margin-left:2px}
.tl-l .s{font-size:10.5px;color:var(--sub-weak)}
.tl-p{position:relative;flex:1;min-width:0;height:78px;margin:6px 0}
.tl-p svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl-ev{height:40px}
.evm{position:absolute;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);padding:0}
.evm.plan{background:#fff!important;border:2px dashed currentColor;box-shadow:none}
.evm:hover{transform:scale(1.25);z-index:2}
.evm.on{box-shadow:0 0 0 3px var(--accent-line)}
.tl-cur{position:absolute;top:0;bottom:22px;width:1px;background:var(--ink2);opacity:.5;pointer-events:none;display:none}
.tl-date{position:absolute;top:-4px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10.5px;border-radius:6px;padding:1px 7px;white-space:nowrap;pointer-events:none;display:none;font-family:'Nunito','Noto Sans JP'}
.tl-x{position:relative;height:20px;margin-left:178px;font-family:'Nunito','Noto Sans JP';font-size:10.5px;color:var(--sub-weak)}
.tl-x span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:3px}
.tl-x span.rel{color:var(--accent2);font-weight:700}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lchip{border:1px solid var(--rule2);background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.lchip i{width:8px;height:8px;border-radius:50%;opacity:.35}
.lchip.on{color:var(--ink);border-color:var(--ink2)}
.lchip.on i{opacity:1}

/* 表・棒 */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:600;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule2);font-size:11.5px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.r,th.r{text-align:right}
td.r{font-family:'Nunito','Noto Sans JP';font-weight:700;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#fbfaf7}
.tw{overflow-x:auto}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bars{display:grid;gap:7px}
.br{display:grid;grid-template-columns:minmax(84px,34%) 1fr 58px;gap:8px;align-items:center;font-size:12.5px}
.br-l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-t{position:relative;height:12px;background:var(--neufill);border-radius:6px}
.br-t i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.br-t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.br-v{text-align:right;font-family:'Nunito';font-weight:700}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;font-size:11px;color:#fff;font-weight:700}
.stack span{display:grid;place-items:center;overflow:hidden;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--sub)}
.kpi .v{font-size:21px}
.kpi .v small{font-size:11.5px;color:var(--sub);margin-left:2px}
.kpi .s{font-size:11px;color:var(--sub)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{border-radius:999px;padding:3px 11px;background:var(--neufill);font-size:12.5px}
.words span b{font-family:'Nunito';color:var(--sub);margin-left:5px;font-size:11px}
.voice{display:grid;gap:8px}
.voice div{border-left:3px solid var(--rule2);padding:4px 10px;font-size:13px;background:#fcfbf9;border-radius:0 8px 8px 0}
.voice div.p{border-color:#5fae86}.voice div.n{border-color:#d98476}
.voice small{display:block;color:var(--sub-weak);font-size:10.5px}

/* 位置の帯 */
.pos{position:relative;height:26px;margin:4px 0}
.pos-t{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:linear-gradient(90deg,#eecac5,#f1eee8 35%,#f1eee8 65%,#bfe0cd)}
.pos-b{position:absolute;top:6px;height:14px;border-radius:7px;background:var(--accent);opacity:.25}
.pos-m{position:absolute;top:3px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--accent2)}
.pos-p{position:absolute;top:10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#b9bec4}
.posrow{display:grid;grid-template-columns:150px 1fr 96px;gap:12px;align-items:center;font-size:12.5px}
.pos-ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub-weak);margin-left:162px;margin-right:108px}
.range{position:relative;height:44px;margin:10px 0 4px}
.range .t{position:absolute;left:0;right:0;top:20px;height:4px;background:var(--neufill);border-radius:2px}
.range .b{position:absolute;top:13px;height:18px;border-radius:9px;background:var(--accent);opacity:.3}
.range .m{position:absolute;top:8px;width:4px;height:28px;margin-left:-2px;background:var(--accent2);border-radius:2px}
.range .now{position:absolute;top:13px;width:2px;height:18px;background:var(--ink)}
.range span{position:absolute;top:-8px;transform:translateX(-50%);font-size:10.5px;color:var(--sub);white-space:nowrap}
.big{font-size:30px;line-height:1.2}
.big small{font-size:13px;color:var(--sub);margin-left:4px}
.tier{display:flex;gap:4px;margin:10px 0}
.tier span{flex:1;text-align:center;border-radius:8px;padding:6px 2px;font-size:12px;background:var(--neufill);color:var(--sub-weak);font-weight:700}
.tier span.on{background:var(--accent);color:#fff}
.tier span.near{background:var(--accent-soft);color:var(--accent2)}
.empty{color:var(--sub);font-size:13px;background:var(--neufill);border-radius:12px;padding:14px 16px}

/* 右パネル */
#scrim{position:fixed;inset:0;background:rgba(40,35,25,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fdfcfa;border-left:1px solid var(--rule);box-shadow:-10px 0 30px rgba(60,50,30,.12);transform:translateX(102%);transition:transform .25s;z-index:41;overflow-y:auto;padding:20px 22px 40px}
body.pn #scrim{opacity:1;pointer-events:auto}
body.pn #panel{transform:none}
.pn-x{position:sticky;top:0;float:right;border:1px solid var(--rule2);background:#fff;border-radius:999px;width:34px;height:34px;font-size:16px}
#panel h2{font-size:19px;margin:6px 0 4px}
.upl{display:grid;gap:8px;margin-top:8px}
.upl div{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:#fff;font-size:13px}
.upl small{color:var(--sub);font-family:'Nunito','Noto Sans JP'}

/* 指標の検索 */
#cmdk{position:fixed;inset:0;z-index:60;display:none;background:rgba(40,35,25,.3);padding:10vh 16px 0}
#cmdk.on{display:block}
.ck{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.ck input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:15px 18px;font-size:15px;outline:none}
.ck-l{max-height:52vh;overflow-y:auto}
.ck-i{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;border:0;background:#fff;width:100%;text-align:left;border-bottom:1px solid var(--rule)}
.ck-i:hover{background:var(--accent-soft)}
.ck-i small{color:var(--sub);white-space:nowrap}

.jl-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;align-items:stretch}
.jl-row.now{border-top:2px solid var(--accent);margin-top:8px;padding-top:2px}
.jl-row.gap .jl-c,.jl-row.now .jl-c{min-height:34px}
.jl-chart{border:1px solid var(--rule);border-radius:14px;padding:14px 16px 10px;margin-bottom:14px;background:#fff}
.jl-ct{display:flex;align-items:baseline;gap:10px 14px;flex-wrap:wrap;margin-bottom:22px;font-size:12.5px;font-weight:700}
.jl-ct b{font-size:22px}.jl-ct b small{font-size:11px;color:var(--sub);margin-left:2px}
.jl-cs{font-weight:400;color:var(--sub);font-size:11.5px}
.hd{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #fff;padding:0;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.15);z-index:1}
.hd b{color:#fff;font:700 10px/1 'Nunito',sans-serif}
.hd.plan{background:#fff!important;border:2px dashed currentColor;box-shadow:none}
.hd.plan b{color:inherit}
.hd:hover,.hd.on,.hd.hl{transform:scale(1.35);z-index:3;box-shadow:0 0 0 3px var(--accent-line)}
.jl-card.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-line)}
.hband{position:absolute;height:7px;border-radius:4px;opacity:.6;border:0;padding:0;cursor:pointer;z-index:2}
.hband:hover{opacity:1}
.hband.plan{opacity:.25}
.jl-src.p{background:var(--neufill);border-color:var(--rule)}
.sq.cont{border-style:dotted;color:var(--sub);background:transparent}
.hnow{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent)}
.hnow span{position:absolute;top:-17px;left:-12px;font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent2);white-space:nowrap}
.jl-no{font-style:normal;color:#fff;font:700 10.5px/18px 'Nunito',sans-serif;width:18px;height:18px;border-radius:50%;text-align:center;flex:none}
.jl-d{display:flex;flex-direction:column;justify-content:center;text-align:right;font-size:11px;color:var(--sub);line-height:1.35}
.jl-d b{font-size:13.5px;color:var(--ink)}
.jl-row.ev .jl-d{justify-content:flex-start;padding-top:14px}
.jl-d em{font-style:normal;font-weight:700;color:var(--accent2)}
.jl-w{position:relative;display:flex;min-height:46px}
.jl-l{position:relative;flex:1;min-width:0;border-left:1px solid var(--rule2)}
.jl-row.head .jl-w{min-height:0}

<script>
/* ================= 基本 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TODAY=new Date(2026,10,15), D0=-84, D1=41, GMAX=140;
/* データソース：1 KARTE／2 CAST／3 SNS計測／4 レビュー／5 検索／6 宣伝データ */
const PHASE_SET={1:[3,6],2:[3,4,5,6],3:[1,2,3,4,5,6]};
const qs=new URLSearchParams(location.search);
const S={castOpen:true,fk:'buzz',jv:'log',cmpSet:['a1','a2'],jw:'mag',cmp:'none',jlMode:'lanes',jlOpen:{fut:true,past:true},deepOpen:{},sim:null,phase:+qs.get('phase')||1,title:'t1',day:0,page:'acts',jl:{},openEv:null,tlRange:'all',layers:{},client:qs.get('view')==='client'};
const has=n=>PHASE_SET[S.phase].includes(n);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const sumA=a=>a.reduce((s,v)=>s+(v||0),0);
const qt=(a,p)=>{const s=[...a].sort((x,y)=>x-y);if(!s.length)return 0;const i=(s.length-1)*p,l=Math.floor(i);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(i-l)};
const med=a=>qt(a,.5);
const pctOf=(v,arr)=>arr.length?Math.round(100*(arr.filter(x=>x<v).length+arr.filter(x=>x===v).length/2)/arr.length):50;
const sig=x=>1/(1+Math.exp(-x));

/* ================= 表示の書式 ================= */
function fN(v){if(v==null||isNaN(v))return '—';const a=Math.abs(v);
  if(a>=1e8)return (v/1e8).toFixed(a>=1e9?1:2)+'億';
  if(a>=1e4)return (v/1e4).toFixed(a>=1e6?0:1)+'万';
  return Math.round(v).toLocaleString();}
const f1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toFixed(1);
const f2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100).toFixed(2);
function fmtBy(u){return u==='%'||u==='pt'?f1:u==='点'||u==='倍'?f2:fN}
function dp(v,unit,label){if(v==null||isNaN(v))return '';const r=Math.round(v*10)/10;const c=r>0?'up':r<0?'dn':'fl';
  return `<span class="dp ${c}">${r>0?'+':''}${r===0?'0':r.toFixed(Math.abs(r)>=100?0:1)}${unit}</span><span>${label}</span>`;}
function dateOf(T,d){const x=new Date(T.open);x.setDate(x.getDate()+d);return x}
const md=x=>`${x.getMonth()+1}/${x.getDate()}`;
const relLbl=d=>d<0?`公開${-d}日前`:d===0?'公開日':`公開${d+1}日目`;

/* ================= 施策とチャネル ================= */
const CH={
  OWNED:{n:'公式SNS',c:'#1b3a5b'}, PAID_DIGITAL:{n:'デジタル広告',c:'#b06a12'}, PAID_TV:{n:'TV',c:'#7c3aed'},
  EVENT:{n:'イベント',c:'#1f7a4d'}, PR:{n:'パブ',c:'#0e7490'}
};
const isAd=e=>e.ch.startsWith('PAID');
const adsOnX=(X,e)=>isAd(e)?[]:X.ev.filter(q=>isAd(q)&&(q.boost===e.id||(q.d<=e.d&&q.d+(q.len||1)-1>=e.d)));
const GAIN={
  OWNED:{buzz:.5,oeng:1.3,oimp:1.1,search:.3,clip:.4,aware:.3,intent:.4},
  PAID_DIGITAL:{buzz:.25,oeng:.2,oimp:.2,search:.5,clip:.3,aware:.6,intent:.3},
  PAID_TV:{buzz:.3,oeng:.1,oimp:.1,search:.75,clip:.2,aware:1.0,intent:.25},
  EVENT:{buzz:.95,oeng:.6,oimp:.5,search:.4,clip:.6,aware:.2,intent:.55},
  PR:{buzz:.7,oeng:.3,oimp:.3,search:.6,clip:.5,aware:.45,intent:.2}
};
const EV_TPL=[
  [-80,'PR','製作発表・ティザービジュアル解禁',40],[-63,'OWNED','追加キャスト解禁の投稿',15],[-49,'PAID_DIGITAL','特報の動画広告',380],
  [-42,'OWNED','本予告の解禁投稿',20],[-35,'PR','主題歌の発表',30],[-28,'PAID_DIGITAL','本予告の動画広告',620],
  [-21,'EVENT','完成披露試写会',260],[-14,'PAID_TV','TVスポット開始',2400],[-10,'OWNED','場面写真・カウントダウン投稿',15],
  [-7,'PAID_DIGITAL','公開直前の動画広告',540],[-1,'EVENT','前夜祭 舞台挨拶',180],[0,'PR','公開・初日舞台挨拶',60],
  [3,'OWNED','感想投稿キャンペーン',25],[8,'EVENT','大ヒット御礼 舞台挨拶',150],[14,'PAID_DIGITAL','口コミ訴求の動画広告',300],[21,'OWNED','入場者特典 第2弾の告知',15]
];
const EV_TYPES=['製作発表','キャスト解禁','特報の広告','本予告の解禁','主題歌の発表','本予告の広告','完成披露','TVスポット','場面写真・カウントダウン','公開直前の広告','前夜祭','初日舞台挨拶','感想投稿キャンペーン','大ヒット御礼','口コミ訴求の広告','入場者特典の告知'];
const MEDIA=[['YouTube',.36,560,.9,31],['X',.24,480,1.15,24],['Instagram',.22,620,.8,27],['TikTok',.18,410,.7,22]];

/* ================= 架空データの生成 ================= */
function build(t){
  const r=rng(t.seed), q=t.q, pw=t.power, ix=d=>d-D0;
  const open=new Date(TODAY); open.setDate(open.getDate()-t.today);
  const dow=d=>{const x=new Date(open);x.setDate(x.getDate()+d);return x.getDay()};
  const ev=EV_TPL.map((e,i)=>({id:i,d:clamp(e[0]+(e[0]===0?0:(t.shift||0)+(t.jit?Math.round((r()-.5)*t.jit):0)),D0,D1),ch:e[1],len:e[1]==='PAID_DIGITAL'?7:e[1]==='PAID_TV'?10:1,ty:EV_TYPES[i],src:e[1]==='PR'?'auto':'reg',art:e[1]==='PR'?(i*7+t.seed)%30+6:0,label:e[2],str:+(0.55+r()*0.95).toFixed(2),cost:Math.round(e[3]*(0.7+r()*0.6)*pw)})).filter(e=>!(t.skip||[]).includes(e.id));
  ev.forEach(e=>{const m={5:3,14:12}[e.id];if(m!=null&&ev.some(q=>q.id===m))e.boost=m});
  const flow=(B,gk,o)=>{const a=[];for(let d=D0;d<=D1;d++){
    let base=d<0?(o.preZero?0:Math.exp(d/o.pre)):o.postMul*Math.exp(-d/o.postTau);
    let v=B*pw*base;
    if(gk)for(const e of ev)if(d>=e.d&&d-e.d<12&&!(o.preZero&&d<0))v+=GAIN[e.ch][gk]*e.str*B*pw*(o.evK||1.3)*Math.exp(-(d-e.d)/2.2);
    const w=dow(d);if(o.wk&&(w===0||w===6))v*=1+o.wk;
    a.push(Math.max(0,v*(0.88+r()*0.24)));}return a;};
  const s={};
  s.buzz=flow(2400,'buzz',{pre:24,postMul:1.9*(0.6+q),postTau:14+q*22,wk:.15});
  s.oimp=flow(180000,'oimp',{pre:30,postMul:1.2,postTau:20,wk:.05});
  s.oeng=flow(5200,'oeng',{pre:28,postMul:1.3*(0.7+q*.5),postTau:18,wk:.05});
  s.search=flow(9000,'search',{pre:20,postMul:1.8,postTau:12+q*12,wk:.25});
  s.clip=flow(160,'clip',{pre:22,postMul:3.2,postTau:9+q*9,wk:.2});
  s.mark=flow(520,null,{preZero:true,postMul:1,postTau:8+q*42,wk:.6});
  s.gross=[];const gr=rng(t.seed+7);
  s.grossFull=[];for(let d=0;d<=GMAX;d++){const w=dow(d);s.grossFull.push(4200*pw*Math.exp(-d/(11+q*30))*((w===0||w===6)?2.3:w===5?1.3:1)*(0.9+gr()*0.2));}
  for(let d=D0;d<=D1;d++)s.gross.push(d<0?0:s.grossFull[d]);
  /* 広告：出稿期間に費用を配る */
  s.aspD=Array(D1-D0+1).fill(0); s.aspT=Array(D1-D0+1).fill(0);
  for(const e of ev){if(e.ch==='PAID_DIGITAL')for(let k=0;k<7;k++){if(e.d+k<=D1)s.aspD[ix(e.d+k)]+=e.cost*1e4/7}
    if(e.ch==='PAID_TV')for(let k=0;k<10;k++){if(e.d+k<=D1)s.aspT[ix(e.d+k)]+=e.cost*1e4/10}}
  const cpmD=520*(0.9+r()*0.25), cpmT=900*(0.9+r()*0.2), ctr0=0.7+q*0.45;
  s.aimp=s.aspD.map((v,i)=>v/cpmD*1000+s.aspT[i]/cpmT*1000);
  s.aclk=s.aspD.map((v,i)=>v/cpmD*1000*(ctr0-(i/(D1-D0))*0.2)*(0.92+r()*0.16)/100);
  s.aview=s.aspD.map(v=>v/cpmD*1000*(0.22+q*0.12)*(0.92+r()*0.16));
  /* 率の系列 */
  s.aware=[];s.intent=[];s.sent=[];s.neg=[];s.score=[];s.sat=[];s.nps=[];
  for(let d=D0;d<=D1;d++){
    let a=6+44*Math.sqrt(pw)*sig((d+28)/16), it=3+20*sig((d+20)/14)*(0.7+q*0.6);
    for(const e of ev)if(e.d<=d){a+=GAIN[e.ch].aware*e.str*1.6;it+=GAIN[e.ch].intent*e.str*1.05}
    s.aware.push(clamp(a+(r()-.5)*1.2,2,94)); s.intent.push(clamp(it+(r()-.5)*1,1,62));

function crStats(T,c,d){if(c.d>d)return null;const r=rng(T.seed*29+c.i*13),g=1-Math.exp(-(d-c.d+1)/4),pw=T.power*(c.e.str||1),ad=isAd(c.e);

  const v=95000*pw*(0.5+r())*g*(c.k==='photo'?1.25:1),er=2.2+r()*5.5;return {a:['投稿の表示',fN(v),'回'],b:['反応率',f1(er),'%'],eng:v*er/100}}

/* ---------- 作品の顔（ポスター）を各所に ---------- */
function heroHTML(T,d){const th=thOf(T),rec=crList(T).filter(c=>c.d<=d).slice(-3).reverse(),n=crList(T).filter(c=>c.d<=d).length,o=T.open;
  return `<section class="hero"><div class="hero-bg">${svgW(1200,320,scene(th,1200,320,T.seed*41,{hz:.86,fs:.42,fx:.8}))}</div><div class="hero-in">
    <div class="hero-po">${poster(T)}</div>
    <div class="hero-tx"><span class="chip">${T.kind}・${T.genre}</span><h1>${T.name}</h1><p class="hero-copy">${th.copy}</p>
      <div class="hero-meta"><span>公開日<b class="num">${o.getFullYear()}.${o.getMonth()+1}.${o.getDate()}</b></span><span>公開規模<b class="num">${T.screens}</b>スクリーン</span><span>いま<b>${relLbl(d)}</b></span></div>
      ${has(6)?`<button class="btn ghost" data-page="creative">素材をすべて見る（${n}点）</button>`:''}</div>
    ${has(6)&&rec.length?`<div class="hero-strip"><em>最近出した素材</em>${rec.map(c=>`<button data-cr="${c.id}"><span class="cr-th k-${c.k}" style="background:${th.g[0]}">${crArt(T,c)}</span><small>${c.n}</small></button>`).join('')}</div>`:''}</div></section>`}
function matArt(T,n){const i=n.length*7;return /ポスター|ビジュアル/.test(n)?poster(T,{fit:'slice'}):/SNS/.test(n)?sqImg(T,i,''):movThumb(T,i,'','')}

/* ================= 描画 ================= */
function visiblePages(d){return PAGES.filter(p=>ITEMS.some(it=>it.page===p.k&&avail(it,d)))}
function render(){const T=cur(),d=S.day;
  if(!visiblePages(d).some(p=>p.k===S.page))S.page='acts';
  $('#selTitle').value=S.title;$('#selPo').innerHTML=poster(T,{fit:'slice'});$('#phaseChip').textContent=relLbl(d);$('#dateLbl').innerHTML=md(dateOf(T,d))+(d>T.today?'<em class="fut">この先は見本の数字</em>':'');
  const dy=$('#day');dy.min=-70;dy.max=D1;dy.value=d;
  $$('#segPhase button').forEach(b=>b.classList.toggle('on',+b.dataset.p===S.phase));
  document.body.classList.toggle('client',S.client);$('#btnClient').textContent=S.client?'社内表示に戻す':'配給会社の表示にする';
  $('#tabs').innerHTML=visiblePages(d).map(p=>`<button class="tab ${p.k===S.page?'on':''}" data-page="${p.k}"><span class="tl">${p.n}</span><span class="ts">${TAB_SHORT[p.k]}</span></button>`).join('');
  $('#mDate').textContent=`${md(dateOf(T,d))}｜${relLbl(d)}`;appSave();
  const pg=PAGES.find(p=>p.k===S.page),list=ITEMS.filter(it=>it.page===S.page&&avail(it,d)),dl=list.filter(it=>it.deep);
  const card=it=>{const o=it.fn(T,d);return `<section class="card c${it.w}" id="it-${it.id}" data-need="${it.need.join(',')}"><div class="card-h"><h2>${it.t}</h2><span class="d">${o.d||''}</span></div>${srcChips(it)}${o.h}</section>`};
  $('#page').innerHTML=`${S.page==='home'?heroHTML(T,d):''}<div class="pg-head">${S.page==='home'?'':`<span class="pg-po">${poster(T,{fit:'slice'})}</span>`}<h1>${pg.n}</h1><span class="pg-q">${pg.q}</span><span class="chip neu">${T.name}｜${md(dateOf(T,d))}時点</span><span class="srcs int-only" style="margin:0"><span class="sc-l">社内表示：各項目に、使っているデータを出しています</span><span class="sc">番号つき＝6分類</span><span class="sc c">共通のデータ</span><span class="sc l">点線＝上のPhaseで加わる</span></span></div>${castGuide(T,d)}<div class="grid">${list.filter(it=>!it.deep).map(card).join('')}</div>${dl.length?`<details class="deep" ${S.deepOpen[S.page]?'open':''}><summary>くわしく見る<span>${dl.length}項目</span></summary><div class="grid">${dl.map(card).join('')}</div></details>`:''}`;
  const dt=$('details.deep');if(dt)dt.addEventListener('toggle',()=>{S.deepOpen[S.page]=dt.open});
  const cgd=$('details.castg');if(cgd)cgd.addEventListener('toggle',()=>{S.castOpen=cgd.open});
  bindTimeline($('#page'));
  document.documentElement.style.setProperty('--toph',$('.top').offsetHeight+'px');
}
function setPage(p,hit){closePanel();S.page=p;if(hit){const h=ITEMS.find(x=>x.id===hit||x.hit===hit&&x.page===p);if(h&&h.deep)S.deepOpen[p]=true}render();window.scrollTo({top:0});
  if(hit){const it=ITEMS.find(x=>x.id===hit||x.hit===hit&&x.page===p),el=it&&$('#it-'+it.id);if(el){el.scrollIntoView({block:'center'});el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),1800)}}}
function setTitle(k){S.openEv=null;S.title=k;S.day=TT[k].today;render()}

document.addEventListener('click',ev=>{const t=ev.target.closest('[data-page],[data-go],[data-ev],[data-rg],[data-layer],[data-p],[data-ck],[data-sim],[data-jev],[data-jl],[data-jsec],[data-jm],[data-jw],[data-jv],[data-cs],[data-fk]');if(!t)return;
  if(t.dataset.fk){S.fk=t.dataset.fk;render();return}
  if(t.dataset.jv){S.jv=t.dataset.jv;render();return}
  if(t.dataset.cs){const k=t.dataset.cs;S.cmpSet=S.cmpSet.includes(k)?S.cmpSet.filter(x=>x!==k):S.cmpSet.concat(k);render();return}
  if(t.dataset.jw){S.jw=t.dataset.jw;render();return}
  if(t.dataset.jm){S.jlMode=t.dataset.jm;render();return}
  if(t.dataset.jsec){S.jlOpen[t.dataset.jsec]=!S.jlOpen[t.dataset.jsec];render();return}
  if(t.dataset.jev!=null){const id=+t.dataset.jev;S.openEv=S.openEv===id?null:id;render();const el=$('#jl-'+id);if(el&&S.openEv===id)el.scrollIntoView({block:t.classList.contains('hd')?'center':'nearest'});return}
  if(t.dataset.sim!=null){S.sim=+t.dataset.sim||null;render();return}
  if(t.dataset.page)setPage(t.dataset.page);
  else if(t.dataset.go)setPage(t.dataset.go,t.dataset.hit);
  else if(t.dataset.ev!=null)openEvent(+t.dataset.ev);
  else if(t.dataset.rg){S.tlRange=t.dataset.rg;render()}
  else if(t.dataset.layer){const L=tlLayers(S.day),k=t.dataset.layer;let on=L.on.slice();on=on.includes(k)?on.filter(x=>x!==k):on.concat(k);if(on.length)S.layers[S.phase]=LAYER_KEYS.filter(x=>on.includes(x));render()}
  else if(t.dataset.p){S.phase=+t.dataset.p;render()}
  else if(t.dataset.ck){closeCk();const it=ITEMS.find(x=>x.id===t.dataset.ck);setPage(it.page,it.id)}
  if(t.dataset.go&&t.tagName==='TR')return;});
$('#scrim').onclick=closePanel;
document.addEventListener('mouseover',ev=>{const t=ev.target.closest('.hd,.jl-card');$$('.hl').forEach(x=>x.classList.toggle('hl',false));if(!t)return;const isDot=t.classList.contains('hd'),id=isDot?t.dataset.jev:t.id.slice(3),c=$('#jl-'+id),h=$('.hd[data-jev="'+id+'"]');if(isDot&&c)c.classList.add('hl');if(!isDot&&h)h.classList.add('hl')});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-cg],[data-cgp]');if(!t)return;ev.preventDefault();
  if(t.dataset.cgp!=null){S.phase=3;S.day=clamp(+t.dataset.day,-70,D1);S.openEv=null;render();return}
  const it=ITEMS.find(x=>x.id===t.dataset.cg);S.phase=3;S.day=clamp(+t.dataset.cgd,-70,D1);S.openEv=null;setPage(it.page,it.id)});
document.addEventListener('change',ev=>{const t=ev.target.closest('[data-cmp]');if(t){S.cmp=t.value;render()}});
$('#day').oninput=e=>{S.day=+e.target.value;render()};
$('#btnToday').onclick=()=>{S.day=cur().today;render()};
$('#btnClient').onclick=()=>{S.client=!S.client;render()};
$('#selTitle').innerHTML=`<optgroup label="公開前・公開中">${TITLE_DEFS.map(t=>`<option value="${t.k}">${t.name}</option>`).join('')}</optgroup><optgroup label="過去作">${PAST.map(t=>`<option value="${t.k}">${t.name}</option>`).join('')}</optgroup>`;
$('#selTitle').onchange=e=>setTitle(e.target.value);

/* 指標の検索 */
function openCk(){$('#cmdk').classList.add('on');$('#ckQ').value='';drawCk();$('#ckQ').focus()}
function closeCk(){$('#cmdk').classList.remove('on')}
function drawCk(){const q=$('#ckQ').value.trim(),d=S.day;const seen=new Set(),list=[];ITEMS.filter(it=>avail(it,d)).forEach(it=>{seen.add(it.t);if(!q||it.t.includes(q))list.push([it.t,it])});
  Object.entries(ALIAS).forEach(([t,id])=>{const it=ITEMS.find(x=>x.id===id);if(it&&avail(it,d)&&!seen.has(t)&&(!q||t.includes(q))){seen.add(t);list.push([t,it])}});
  $('#ckL').innerHTML=list.slice(0,80).map(([t,it])=>`<button class="ck-i" data-ck="${it.id}"><span>${t}</span><small>${PAGES.find(p=>p.k===it.page).n}${t!==it.t?'｜'+it.t:''}</small></button>`).join('')||'<div class="empty" style="margin:14px">見つかりません。</div>'}
$('#btnSearch').onclick=openCk;$('#ckQ').oninput=drawCk;$('#cmdk').onclick=e=>{if(e.target.id==='cmdk')closeCk()};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmdk').classList.contains('on')?closeCk():openCk()}
  if(e.key==='Escape'){if($('#cmdk').classList.contains('on'))closeCk();else closePanel()}});

/* 総点検：Phase×作品×基準日×ページ */
function aliasCheck(){const keep={...S},miss=[];S.phase=3;for(const [t,id] of Object.entries(ALIAS)){const it=ITEMS.find(x=>x.id===id);if(!it){miss.push([t,id,'項目なし']);continue}
  const ok=[['t1',-12],['t3',23]].some(([k,d])=>{S.title=k;S.day=d;S.page=it.page;S.deepOpen[it.page]=true;if(!avail(it,d))return false;render();return !!$('#it-'+id)});if(!ok)miss.push([t,id,'表示されない'])}
  Object.assign(S,keep);render();return {total:Object.keys(ALIAS).length,miss}}
function selfCheck(){const keep={...S,deepOpen:{...S.deepOpen}},bad=[];let n=0;S.client=true;PAGES.forEach(p=>S.deepOpen[p.k]=true);
  const NG={1:/Mark!|Clip!|検索|認知率|観たい率|満足度|NPS|レビュー|アンケート|宣伝効果指数/,2:/認知率|観たい率|満足度|NPS|アンケート|宣伝効果指数/,3:/反応スコア/};
  for(const ph of [1,2,3])for(const t of TITLE_DEFS){const T=TT[t.k];for(const d of [-60,-30,-12,-1,0,1,2,5,13,20,27].filter(x=>x<=T.today)){S.phase=ph;S.title=t.k;S.day=d;
    for(const p of visiblePages(d)){S.page=p.k;try{render()}catch(e){bad.push([ph,t.k,d,p.k,'ERR '+e.message]);continue}n++;const tx=$('#page').innerText;
      if(/NaN|undefined|Infinity|null/.test(tx))bad.push([ph,t.k,d,p.k,(tx.match(/.{0,20}(NaN|undefined|Infinity|null).{0,10}/)||[''])[0]]);
      const m=tx.match(NG[ph]);if(m)bad.push([ph,t.k,d,p.k,'範囲外の語：'+m[0]]);
      $$('#page [data-need]').forEach(el=>{if(!el.dataset.need.split(',').filter(Boolean).every(x=>has(+x)))bad.push([ph,t.k,d,p.k,'範囲外の項目：'+el.id])})}
    for(const e of T.ev){try{openEvent(e.id);const px=$('#panel').innerText;if(/NaN|undefined|Infinity/.test(px)||NG[ph].test(px))bad.push([ph,t.k,d,'panel',e.label])}catch(er){bad.push([ph,t.k,d,'panel','ERR '+er.message])}}closePanel()}}
  Object.assign(S,keep);render();return {pages:n,bad:bad.slice(0,30),badCount:bad.length}}

/* ================= スマホアプリとして使うための部分 ================= */
const TAB_SHORT={creative:'素材',acts:'施策',plan:'設計',home:'今日',deliver:'届け方',interest:'関心',audience:'観客',outlook:'見通し'};
const APPK='crew_v7_app_1';
/* 前回の作品・ページ・表示を覚えておき、次に開いたときに戻す（基準日は毎回「今日」に戻す） */
function appSave(){try{localStorage.setItem(APPK,JSON.stringify({title:S.title,page:S.page,phase:S.phase,client:S.client,jv:S.jv,jw:S.jw,fk:S.fk,tlRange:S.tlRange,cmpSet:S.cmpSet,castOpen:S.castOpen}))}catch(e){}}
function appLoad(){try{const o=JSON.parse(localStorage.getItem(APPK)||'null');if(!o)return;if(TT[o.title])S.title=o.title;if(PAGES.some(p=>p.k===o.page))S.page=o.page;
  if(!qs.get('phase')&&[1,2,3].includes(o.phase))S.phase=o.phase;if(!qs.get('view'))S.client=!!o.client;['jv','jw','fk','tlRange'].forEach(k=>{if(typeof o[k]==='string')S[k]=o[k]});
  if(Array.isArray(o.cmpSet))S.cmpSet=o.cmpSet.filter(k=>TT[k]);if(typeof o.castOpen==='boolean')S.castOpen=o.castOpen}catch(e){}}
$('#mDate').onclick=()=>{const on=document.body.classList.toggle('m-date');document.body.classList.remove('m-more');$('#mDate').setAttribute('aria-expanded',on);$('#mMore').setAttribute('aria-expanded',false)};
$('#mMore').onclick=()=>{const on=document.body.classList.toggle('m-more');document.body.classList.remove('m-date');$('#mMore').setAttribute('aria-expanded',on);$('#mDate').setAttribute('aria-expanded',false)};
document.addEventListener('click',ev=>{if(ev.target.closest('[data-page]'))document.body.classList.remove('m-date','m-more')});
/* ホーム画面への追加の案内（スマホ幅で、まだアプリとして開いていないときだけ。閉じたら出さない） */
(function(){const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone,box=$('#a2hs');let seen=false;try{seen=!!localStorage.getItem(APPK+'_a2hs')}catch(e){}
  const hide=()=>{box.hidden=true;try{localStorage.setItem(APPK+'_a2hs','1')}catch(e){}};$('#a2hsX').onclick=hide;
  if(standalone||seen||!matchMedia('(max-width:900px)').matches||!/^https?:/.test(location.protocol))return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){$('#a2hsT').textContent='共有ボタンから「ホーム画面に追加」を選ぶと、アプリとして使えます。';box.hidden=false}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();$('#a2hsT').textContent='ホーム画面に追加すると、アプリとして使えます。';$('#a2hsB').hidden=false;box.hidden=false;$('#a2hsB').onclick=()=>{e.prompt();hide()}})})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  let _swr=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_swr)return;_swr=true;location.reload()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}
if(matchMedia('(max-width:900px)').matches)S.castOpen=false;
if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&location.protocol!=='file:'&&!qs.get('view'))S.client=true;
evLoad();appLoad();S.day=cur().today;render();
</script>
</body>
</html>
